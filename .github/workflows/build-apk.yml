name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write    # needed to create releases

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          FULL_VERSION=$(echo "$VERSION_LINE" | awk '{print $2}')
          APP_VERSION=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          echo "tag=v$APP_VERSION-build.$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Detected version: $APP_VERSION (build $BUILD_NUMBER)"

      - name: Reject conflicting release tag
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 '${{ steps.version.outputs.tag }}')" = "$GITHUB_SHA" || exit 1
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} is new — release will be created."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!NAME}" || { echo "Missing required signing secret: $NAME" >&2; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          python3 - <<'PY'
          import os
          def escape(value):
              units = value.encode('utf-16-be')
              return ''.join('\\u%04x' % int.from_bytes(units[i:i+2], 'big') for i in range(0, len(units), 2))
          values = {'storePassword': os.environ['KEYSTORE_PASSWORD'],
                    'keyPassword': os.environ['KEY_PASSWORD'],
                    'keyAlias': os.environ['KEY_ALIAS'],
                    'storeFile': 'upload-keystore.jks'}
          with open('android/key.properties', 'w') as f:
              for key, value in values.items():
                  f.write(key + '=' + escape(value) + '\n')
          PY

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo 'Missing Supabase build configuration' >&2; exit 1; }
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/qrcode-monitoring-${{ steps.version.outputs.tag }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.tag }}
          path: release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
